
name: Build KR Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KR_Store_Android_and_PlayStore_Package(2).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android package
        run: |
          unzip -q 'KR_Store_Android_and_PlayStore_Package(2).zip' -d /tmp/krstore
          cp -R /tmp/krstore/KR_Store_App_Package/android ./android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build KR Store APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KR-Store-APK
          path: android/app/build/outputs/apk/debug/*.apk
          
